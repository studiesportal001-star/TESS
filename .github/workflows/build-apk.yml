name: Build Azrix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azrix_v3
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Azrix_v2.apk
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azrix_v2-apk
          path: Azrix_v3/out/Azrix_v2.apk
          if-no-files-found: error

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          TAG="v${VER}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/Azrix_v2.apk --title "Azrix_v2 ${VER} (build ${GITHUB_RUN_NUMBER})" --notes "Built from ${GITHUB_SHA}" --target "$GITHUB_SHA"
